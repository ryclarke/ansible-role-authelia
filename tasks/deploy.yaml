---
- name: Resolve role source paths
  ansible.builtin.set_fact:
    authelia_role_source_path: "{{ authelia_role_path | default(role_path) }}"
    authelia_configuration_source: >-
      {{ authelia_configuration_template
         if authelia_configuration_template is match('^/')
         else (authelia_role_path | default(role_path)) ~ '/templates/' ~ authelia_configuration_template }}

- name: Create service data directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop: "{{ authelia_directories }}"

- name: Write Docker secret files
  ansible.builtin.copy:
    dest: "{{ authelia_root }}/secrets/{{ item.name }}"
    content: "{{ item.content }}"
    owner: "{{ authelia_render_owner | default('root') }}"
    group: "{{ authelia_render_group | default(authelia_hardening._defaults.group) }}"
    mode: "{{ authelia_render_mode | default('0440') }}"
  no_log: true
  loop: "{{ authelia_secrets_files }}"
  notify: reconcile authelia

- name: Build Authelia configuration
  ansible.builtin.template:
    src: "{{ authelia_configuration_source }}"
    dest: "{{ authelia_root }}/authelia/configuration.yml"
    owner: "{{ authelia_render_owner | default(authelia_hardening.authelia.user) }}"
    group: "{{ authelia_render_group | default(authelia_hardening.authelia.group) }}"
    mode: "{{ authelia_render_mode | default('0600') }}"
  notify: restart authelia

- name: Initialize Authelia healthcheck file
  ansible.builtin.file:
    path: "{{ authelia_root }}/authelia/healthcheck.env"
    state: touch
    owner: "{{ authelia_render_owner | default(authelia_hardening.authelia.user) }}"
    group: "{{ authelia_render_group | default(authelia_hardening.authelia.group) }}"
    mode: "{{ authelia_render_mode | default('0644') }}"
  changed_when: false

- name: Export Redis config
  ansible.builtin.template:
    src: "{{ authelia_role_source_path }}/templates/redis.conf.j2"
    dest: "{{ authelia_root }}/secrets/redis.conf"
    owner: "{{ authelia_render_owner | default(authelia_hardening.redis.user) }}"
    group: "{{ authelia_render_group | default(authelia_hardening.redis.group) }}"
    mode: "{{ authelia_render_mode | default('0600') }}"
  no_log: true
  notify: reconcile authelia
  when:
    - authelia_redis_enabled
    - authelia_redis_managed
    - authelia_redis_password | default('', true) | length > 0

- name: Build Compose environment (.env)
  ansible.builtin.copy:
    dest: "{{ authelia_root }}/.env"
    content: "{{ (authelia_compose_env | dictsort | map('join', '=') | join('\n')) ~ '\n' }}"
    owner: "{{ authelia_render_owner | default('root') }}"
    group: "{{ authelia_render_group | default('root') }}"
    mode: "{{ authelia_render_mode | default('0600') }}"
  no_log: true
  notify: reconcile authelia

- name: Build Compose file
  ansible.builtin.template:
    src: "{{ authelia_role_source_path }}/templates/compose.yml.j2"
    dest: "{{ authelia_root }}/compose.yml"
    owner: "{{ authelia_render_owner | default('root') }}"
    group: "{{ authelia_render_group | default('root') }}"
    mode: "{{ authelia_render_mode | default('0600') }}"
  notify: reconcile authelia

- name: Validate rendered Compose spec
  ansible.builtin.command:
    cmd: docker compose config -q
    chdir: "{{ authelia_root }}"
  changed_when: false
  when:
    - not ansible_check_mode
    - not (authelia_skip_validation | default(false))

- name: Validate rendered Authelia configuration
  ansible.builtin.command:
    cmd: docker compose run --rm --no-deps authelia authelia config validate --config /config/configuration.yml
    chdir: "{{ authelia_root }}"
  changed_when: false
  when:
    - not ansible_check_mode
    - not (authelia_skip_validation | default(false))
